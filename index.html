<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<script src="biblioteca/componentes.js"></script>
<title>Mesa de Diseño PCB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: aplicación de pantalla completa — menús, barra de herramientas, panel izquierdo plegable, tablero, propiedades a la derecha, barra de estado */
:root{
  --bg:#e9eee9; --panel:#f7f9f6; --panel2:#eef2ee; --ink:#152019; --muted:#5a6a60; --line:#d2dbd4;
  --accent:#a95b17; --accent-soft:#f3e4d4; --accent-ink:#ffffff; --sel:#0b7a75;
  --ws-bg:#fbfcfa; --ws-fine:rgba(25,60,40,.11); --ws-major:rgba(25,60,40,.30); --ws-silk:#24332a; --ws-copper:#c27a2f;
  --ws-edge:#b07d00; --ws-board:rgba(46,110,70,.07); --ws-ref:#4b5d52; --ruler:#eef2ee; --ruler-ink:#5a6a60;
  --paper:#ffffff; --toner:#111111; --err:#c62a1c;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Verdana",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Consolas",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c120f; --panel:#141d18; --panel2:#19241e; --ink:#e3ebe5; --muted:#93a59a; --line:#28362e;
  --accent:#e09a52; --accent-soft:#3a2a1a; --accent-ink:#1a1006; --sel:#4fd1c5;
  --ws-bg:#101814; --ws-fine:rgba(200,230,210,.07); --ws-major:rgba(200,230,210,.20); --ws-silk:#dde8e0; --ws-copper:#d99a52;
  --ws-edge:#e6c34a; --ws-board:rgba(80,160,110,.10); --ws-ref:#a3b5aa; --ruler:#141d18; --ruler-ink:#93a59a; --err:#ff6b5b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c120f; --panel:#141d18; --panel2:#19241e; --ink:#e3ebe5; --muted:#93a59a; --line:#28362e;
  --accent:#e09a52; --accent-soft:#3a2a1a; --accent-ink:#1a1006; --sel:#4fd1c5;
  --ws-bg:#101814; --ws-fine:rgba(200,230,210,.07); --ws-major:rgba(200,230,210,.20); --ws-silk:#dde8e0; --ws-copper:#d99a52;
  --ws-edge:#e6c34a; --ws-board:rgba(80,160,110,.10); --ws-ref:#a3b5aa; --ruler:#141d18; --ruler-ink:#93a59a; --err:#ff6b5b; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;margin:0;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto}

/* menús */
.menubar{display:flex;align-items:center;gap:2px;padding-inline:10px;background:var(--panel);border-bottom:1px solid var(--line);min-height:36px;position:relative;z-index:30}
.logo{font-family:var(--f-display);font-size:1rem;margin-right:10px;letter-spacing:.02em;white-space:nowrap}
.logo b{color:var(--accent)}
.menu{position:relative}
.menu > button{background:none;border:0;padding:6px 10px;border-radius:6px}
.menu > button:hover,.menu.open > button{background:var(--panel2)}
.drop{position:absolute;top:100%;left:0;min-width:250px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column}
.drop button{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;background:none;border:0;text-align:left;padding:7px 10px;border-radius:6px}
.drop button:hover:not(:disabled){background:var(--accent-soft)}
.drop button:disabled{opacity:.45;cursor:default}
.drop kbd,.drop small{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.drop hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
.drop.ctx{position:fixed;top:auto;min-width:230px;z-index:60}
.ctxh{font-size:.75rem;color:var(--muted);padding:4px 10px 6px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop button.danger{color:var(--err)}
.ctxn{margin:0 10px 6px;max-width:280px;font-size:.85rem;line-height:1.35}
.ctxh.err{color:var(--err);font-weight:700}
.docname{margin-left:auto;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.docname b{color:var(--ink)}

/* barra de herramientas */
.toolbar{display:flex;align-items:center;gap:4px;padding:5px 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tb{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:8px;padding:5px 9px;white-space:nowrap;font-size:.88rem}
.tb:hover:not(:disabled){background:var(--panel2);border-color:var(--line)}
.tb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tb:disabled{opacity:.4;cursor:default}
.tb svg{width:18px;height:18px;flex:none}
.sep{width:1px;height:24px;background:var(--line);margin-inline:4px;flex:none}
.split{display:inline-flex;flex:none}
.split #copperMain{border-top-right-radius:0;border-bottom-right-radius:0}
.split .arrow{padding:5px 4px;border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-1px}
.drop button span svg{width:15px;height:15px;vertical-align:-3px}
.twsel{font:inherit;font-size:.85rem;padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:var(--ws-bg);color:var(--ink);flex:none}
.zoomv{font-family:var(--f-mono);font-size:.8rem;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}

/* cuerpo */
.body{display:grid;grid-template-columns:auto auto 1fr;min-height:0;position:relative}
.work{display:flex;flex-direction:column;min-width:0;min-height:0}
.handle{width:6px;cursor:col-resize;background:transparent;border-right:1px solid var(--line);touch-action:none;position:relative;z-index:5}
.handle:hover,.handle.on{background:var(--accent-soft);border-right-color:var(--accent)}
.handle[hidden]{display:none!important}
.left{width:290px;min-width:200px;max-width:560px;background:var(--panel);display:flex;flex-direction:column;min-height:0}
.left[hidden]{display:none!important}
.sect{border-bottom:1px solid var(--line);padding:10px 12px}
.sect h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;font-family:var(--f-mono);font-weight:600}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tool{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 9px;text-align:left;font-size:.88rem}
.tool svg{width:18px;height:18px;flex:none}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tool:disabled{opacity:.45;cursor:default}
.tool small{display:block;font-size:.7rem;color:var(--muted)}
.libwrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 12px 0}
.libh{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;font-family:var(--f-mono);font-weight:600}
.pvtip{font-size:.75rem;color:var(--muted);margin-top:2px}
#libq{font:inherit;width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--ws-bg);color:var(--ink);margin-bottom:8px}
.libs{overflow-y:auto;flex:1;min-height:0;padding-bottom:8px}
.libs details{border-bottom:1px solid var(--line)}
.libs summary{cursor:pointer;padding:9px 4px;border-radius:6px;font-weight:700;font-size:.9rem;display:flex;justify-content:space-between;list-style:none}
.libs summary::-webkit-details-marker{display:none}
.libs summary::before{content:"▸";color:var(--muted);margin-right:6px;transition:transform .15s}
.libs details[open] summary::before{transform:rotate(90deg)}
.libs summary span:first-child{flex:1}
.libs summary .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-weight:400}
.libs summary:hover{background:var(--panel2)}
.libs details[open] summary{color:var(--accent);position:sticky;top:0;background:var(--panel);z-index:1}
.li{cursor:grab;width:100%;display:flex;justify-content:space-between;gap:6px;background:none;border:0;padding:5px 6px 5px 18px;border-radius:6px;text-align:left;font-size:.87rem}
.li:hover{background:var(--panel2)}
.li[aria-current="true"]{background:var(--accent-soft)}
.li span{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);white-space:nowrap}
.preview{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
#pv{cursor:grab;width:100%;height:120px;border-radius:8px;border:1px solid var(--line);background:var(--ws-bg);display:block}
.pvname{font-weight:700;font-size:.9rem;line-height:1.25}
.pvpkg{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.place{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px;font-weight:700}
.place:disabled{opacity:.4}

.stage{flex:1;position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--ws-bg);touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.88rem;box-shadow:0 4px 14px rgba(0,0,0,.12);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);border-radius:10px;padding:8px 14px;font-size:.88rem;pointer-events:none}

.propbar{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding:3px 10px;min-height:32px;background:var(--panel);border-bottom:1px solid var(--line);font-size:.8rem;white-space:nowrap}
.propbar[hidden]{display:none!important}
.pb-id{display:flex;align-items:baseline;gap:6px;min-width:0;max-width:240px;flex:none}
.pb-id .pname{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.pb-id small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.pb-sep{width:1px;height:16px;background:var(--line);flex:none}
.field{display:flex;align-items:center;gap:4px;flex:none}
.field label{font-size:.72rem;color:var(--muted)}
.field input,.field select{font:inherit;font-size:.8rem;padding:2px 6px;height:24px;border:1px solid var(--line);border-radius:5px;background:var(--ws-bg);color:var(--ink);min-width:0}
.field.w-s input{width:72px}.field.w-m input{width:92px}.field.w-s select,.field.w-m select{width:auto}
.pb-info{font-size:.74rem;color:var(--muted);flex:none}
.pbtns{display:flex;gap:4px;margin-left:auto;flex:none}
.pbtns button{background:none;border:1px solid transparent;border-radius:5px;padding:3px 6px;display:inline-flex;align-items:center;gap:4px;font-size:.76rem;height:24px}
.pbtns button:hover:not(:disabled){background:var(--panel2);border-color:var(--line)}
.pbtns button:disabled{opacity:.4}
.pbtns button svg{width:15px;height:15px}
.pbtns .danger{color:#b4361a}
.pbtns .x{padding:3px 7px}
.muted{color:var(--muted);font-size:.85rem;margin:0;line-height:1.45}

.status{display:flex;gap:16px;align-items:center;padding:4px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.status b{color:var(--ink);font-weight:600}
.status .msg{margin-left:auto;font-family:var(--f-body);overflow:hidden;text-overflow:ellipsis}

/* franja publicitaria reservada */
.adslot{height:64px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border-top:1px solid var(--line);padding-inline:16px}
.adbox{width:468px;max-width:100%;height:60px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:.78rem;font-family:var(--f-mono);letter-spacing:.04em;text-transform:uppercase}
@media (max-width:820px){.adslot{height:54px}.adbox{width:320px;height:50px}}

/* diálogos */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(460px,100%);max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-family:var(--f-display);font-size:1.15rem}
.dlg textarea{width:100%;height:180px;font-family:var(--f-mono);font-size:.75rem;background:var(--ws-bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg .acts button{border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--panel2)}
.dlg .acts .pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.dlg table{border-collapse:collapse;width:100%;font-size:.88rem}
.dlg td{padding:5px 4px;border-bottom:1px solid var(--line)}
.dlg td:first-child{font-family:var(--f-mono);white-space:nowrap;color:var(--accent);width:120px}
.saved{display:flex;flex-direction:column;gap:6px}
.saved div{display:flex;gap:6px}
.saved button{flex:1;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 10px}
.saved .x{flex:none;color:#b4361a}
.saved .err{color:var(--err)}
.radio{display:flex;gap:6px;flex-wrap:wrap}
.radio button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 12px}
.radio button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.dlg .field{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.dlg .field label{font-size:.85rem;width:auto}
.tbspace{flex:1 1 auto;min-width:4px}
.tb .lbl{display:none} /* barra solo con íconos: el nombre sale al pasar el mouse (title) */

@media (max-width:820px){
  .left{position:absolute;inset:0 auto 0 0;z-index:20;box-shadow:8px 0 24px rgba(0,0,0,.2);width:min(290px,85vw)}
  .handle{display:none!important}
  .pbtns{margin-left:0}
  .tb .lbl{display:none}
  .docname{display:none}
}
@media (prefers-reduced-motion:reduce){.libs summary::before{transition:none}}
</style>

<div class="app">
  <nav class="menubar" id="menubar" aria-label="Menú principal">
    <div class="logo">Mesa <b>PCB</b></div>
    <div class="docname" id="docname"></div>
  </nav>
  <div class="toolbar" id="toolbar" role="toolbar" aria-label="Herramientas rápidas"></div>
  <div class="body">
    <aside class="left" id="left" aria-label="Panel de herramientas y biblioteca">
      <div class="libwrap">
        <h2 class="libh">Biblioteca <span id="libn"></span></h2>
        <input id="libq" type="search" placeholder="Buscar: 555, TIP31, relé…" aria-label="Buscar en la biblioteca">
        <div class="libs" id="libs"><p class="muted">Cargando biblioteca…</p></div>
      </div>
      <div class="preview">
        <canvas id="pv" draggable="true" aria-label="Vista previa de la huella. Arrastrala al tablero" title="Arrastrá la huella al tablero"></canvas>
        <div><div class="pvname" id="pvname">Elegí un componente</div><div class="pvpkg" id="pvpkg"></div></div>
        <button class="place" id="placeBtn" disabled>Colocar en el tablero</button>
      </div>
    </aside>
    <div class="handle" id="lh" role="separator" aria-orientation="vertical" aria-label="Cambiar el ancho del panel" title="Arrastrá para cambiar el ancho · doble clic para volver al tamaño normal" tabindex="0"></div>
    <div class="work">
    <div class="propbar" id="right" role="region" aria-label="Propiedades del elemento seleccionado" hidden></div>
    <main class="stage" id="stage">
      <canvas id="cv" tabindex="0" aria-label="Tablero de trabajo"></canvas>
      <div class="hint" id="hint" hidden></div>
      <div class="toast" id="toast" hidden></div>
    </main>
    </div>
  </div>
  <!-- Espacio reservado para publicidad. Escritorio: 468 × 60 · Celular: 320 × 50. Acá va el código de AdSense o AdMob. -->
  <aside class="adslot" id="ad-slot" aria-label="Espacio publicitario"><div class="adbox">Espacio publicitario · <span id="adsize">468 × 60</span></div></aside>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
/* ================= iconos ================= */
const I={
 undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
 redo:'<path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/>',
 panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
 props:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',
 select:'<path d="m5 3 14 8-6 2-2 6z"/>',
 hand:'<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11V4.5a1.5 1.5 0 0 1 3 0V11"/><path d="M14 11V6a1.5 1.5 0 0 1 3 0v8a7 7 0 0 1-7 7h-.5a6 6 0 0 1-5-2.7L3 15a1.5 1.5 0 0 1 2.5-1.7L8 16"/>',
 outline:'<rect x="4" y="6" width="16" height="12" rx="1" stroke-dasharray="3 2"/><circle cx="4" cy="6" r="1.6" fill="currentColor"/><circle cx="20" cy="18" r="1.6" fill="currentColor"/>',
 measure:'<path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/>',
 track:'<path d="M4 18h6l4-8h6"/><circle cx="4" cy="18" r="2"/><circle cx="20" cy="10" r="2"/>',
 text:'<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',
 link:'<circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="18" r="2.2"/><path d="M7 7.5 17 16.5" stroke-dasharray="2.5 2"/>',
 major:'<rect x="3" y="3" width="18" height="18"/><path d="M12 3v18M3 12h18"/>',
 fine:'<path d="M3 7h18M3 12h18M3 17h18M7 3v18M12 3v18M17 3v18" stroke-width="1.3"/>',
 ruler:'<path d="M3 8h18v8H3z"/><path d="M7 8v3M11 8v4M15 8v3M19 8v4"/>',
 snap:'<path d="M6 3v6a6 6 0 0 0 12 0V3"/><path d="M6 3h4M14 3h4"/>',
 rotate:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 zin:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6M11 8v6"/>',
 zout:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6"/>',
 fit:'<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>',
 check:'<path d="m5 12 5 5 9-10"/>',
 vtop:'<rect x="3" y="13" width="18" height="5" rx="1"/><rect x="7" y="6" width="10" height="7" rx="1"/><path d="M9 6V4M12 6V4M15 6V4"/>',
 vbot:'<rect x="3" y="6" width="18" height="5" rx="1"/><path d="M6 15h5l3 3h4"/><circle cx="6" cy="15" r="1.4"/><circle cx="18" cy="18" r="1.4"/>',
 viron:'<path d="M3 18h14a4 4 0 0 0 4-4v-4H10a7 7 0 0 0-7 7z"/><path d="M10 10V6h7"/><path d="M7 21h10"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 unlock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>',
 route:'<circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><path d="M7 19h3l7-7V7"/>',
 drc:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/>'
};
const ico=(k)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;

const f2=n=>(Math.round(n*100)/100).toString().replace('.',',');
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const uid=()=>Math.random().toString(36).slice(2,9);
function rot(x,y,r){r=((r%4)+4)%4;return r===0?[x,y]:r===1?[-y,x]:r===2?[-x,-y]:[y,-x]}
function fpOf(c){return LIB&&LIB.encapsulados[c.enc]}
function padWorld(c,p){const [x,y]=rot(p.x,p.y,c.rot);return [c.x+x,c.y+y]}
function fpBox(fp){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const add=(a,b,c,d)=>{x0=Math.min(x0,a);y0=Math.min(y0,b);x1=Math.max(x1,c);y1=Math.max(y1,d)};
  fp.pads.forEach(p=>{const w=(p.w||p.d)/2,h=(p.h||p.d)/2;add(p.x-w,p.y-h,p.x+w,p.y+h)});
  fp.silk.forEach(s=>{if(s.t==='rect')add(s.x,s.y,s.x+s.w,s.y+s.h);else if(s.t==='circle')add(s.cx-s.r,s.cy-s.r,s.cx+s.r,s.cy+s.r);else if(s.t==='line')add(Math.min(s.x1,s.x2),Math.min(s.y1,s.y2),Math.max(s.x1,s.x2),Math.max(s.y1,s.y2));else if(s.bb)add(...s.bb)});
  return [x0,y0,x1,y1];
}
function compBox(c){
  const fp=fpOf(c);if(!fp)return [c.x-1,c.y-1,c.x+1,c.y+1];
  const [a,b,d,e]=fpBox(fp);const pts=[[a,b],[d,b],[d,e],[a,e]].map(([x,y])=>rot(x,y,c.rot));
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  return [c.x+Math.min(...xs),c.y+Math.min(...ys),c.x+Math.max(...xs),c.y+Math.max(...ys)];
}
const toS=(wx,wy)=>[ox+(view==='abajo'?2*mirC-wx:wx)*scale, oy+wy*scale];
const toW=(sx,sy)=>{let wx=(sx-ox)/scale;if(view==='abajo')wx=2*mirC-wx;return [wx,(sy-oy)/scale]};
const snapV=(v,g)=>Math.round(v/g)*g;
function snapComp(c){ // engancha el pin 1 a la grilla fina
  if(!prefs.snap)return;const fp=fpOf(c);if(!fp)return;
  const [px,py]=padWorld(c,fp.pads[0]);const g=prefs.grid;
  c.x+=snapV(px,g)-px;c.y+=snapV(py,g)-py;
}

/* ================= referencias (R1, C1, U1…) ================= */
function prefixOf(comp){
  const n=norm(comp.nombre),cat=comp.cat;
  if(/^led|display/.test(n))return n.startsWith('display')?'DS':'LED';
  if(/preset|potenciometro/.test(n))return 'RV';
  if(/rele/.test(n))return 'K';if(/pulsador/.test(n))return 'SW';if(/cristal/.test(n))return 'Y';if(/buzzer/.test(n))return 'BZ';
  if(/jack|bornera|tira|zocalo/.test(n))return 'J';
  return {Resistencias:'R',Capacitores:'C',Diodos:'D',Transistores:'Q'}[cat]||'U';
}
function nextRef(p){let i=1;const used=new Set(doc.comps.map(c=>c.ref));while(used.has(p+i))i++;return p+i}
function defaultValue(comp){
  if(comp.cat==='Resistencias'&&/carbon|1\/2|1 w|2 w|cemento/.test(norm(comp.nombre)))return '10 kΩ';
  const m=comp.nombre.match(/^Electrolítico (.+)$/);if(m)return m[1];
  if(comp.familia==='ceramico')return '100 nF';if(comp.familia==='poliester')return '100 nF';
  return comp.nombre.split(' (')[0].replace(/^(Transistor|Regulador|Diodo|MOSFET|Darlington|Triac|Tiristor|Optoacoplador|Optotriac|Sensor de temperatura|Referencia|Memoria EEPROM|Puente rectificador) /,'');
}
function makeComp(comp,x,y,r=0){
  let enc=comp.enc;if(enc==='SIP-n')enc='SIP-4';
  const c={id:uid(),ref:nextRef(prefixOf(comp)),name:comp.nombre,enc,val:defaultValue(comp),x,y,rot:r};
  snapComp(c);return c;
}

/* ================= pads, conexiones y pistas ================= */
const pkey=(cid,n)=>cid+':'+n;
function padsAll(){const out=[];doc.comps.forEach(c=>{const fp=fpOf(c);if(!fp)return;fp.pads.forEach(p=>{const [x,y]=padWorld(c,p);out.push({c,p,x,y,k:pkey(c.id,p.n),r:Math.max(p.w||p.d,p.h||p.d)/2})})});return out}
function hitPad(wx,wy){let best=null,bd=1e9;padsAll().forEach(q=>{const d=Math.hypot(q.x-wx,q.y-wy);if(d<=q.r+.3&&d<bd){bd=d;best=q}});return best}
function padPos(k){const [cid,n]=k.split(':');const c=doc.comps.find(x=>x.id===cid);if(!c)return null;const fp=fpOf(c);if(!fp)return null;const p=fp.pads.find(q=>String(q.n)===n);if(!p)return null;const [x,y]=padWorld(c,p);return {x,y,r:Math.max(p.w||p.d,p.h||p.d)/2}}
function UF(){const par=new Map();const f=a=>{if(!par.has(a))par.set(a,a);let r=a;while(par.get(r)!==r)r=par.get(r);par.set(a,r);return r};return {f,u:(a,b)=>par.set(f(a),f(b))}}
function nets(){ // grupos lógicos de patas (lo que debería estar unido)
  const uf=UF(),keys=new Set();doc.links.forEach(l=>{if(padPos(l.a)&&padPos(l.b)){uf.u(l.a,l.b);keys.add(l.a);keys.add(l.b)}});
  const g=new Map();keys.forEach(k=>{const r=uf.f(k);if(!g.has(r))g.set(r,[]);g.get(r).push(k)});return [...g.values()];
}
function physical(noPlane){ // patas unidas de verdad por cobre (pistas, puentes y plano de masa)
  const uf=UF(),pads=padsAll();const near=(x,y)=>pads.filter(q=>Math.hypot(q.x-x,q.y-y)<=q.r+.01);
  doc.tracks.forEach(t=>{const tk='t:'+t.id;[t.pts[0],t.pts[t.pts.length-1]].forEach(([x,y])=>near(x,y).forEach(q=>uf.u(q.k,tk)))});
  for(let i=0;i<doc.tracks.length;i++)for(let j=i+1;j<doc.tracks.length;j++){const A=doc.tracks[i],B=doc.tracks[j];
    const ends=(T)=>[T.pts[0],T.pts[T.pts.length-1]];
    if(ends(A).some(e=>B.pts.some(p=>Math.hypot(p[0]-e[0],p[1]-e[1])<.01))||ends(B).some(e=>A.pts.some(p=>Math.hypot(p[0]-e[0],p[1]-e[1])<.01)))uf.u('t:'+A.id,'t:'+B.id)}
  (doc.jumpers||[]).forEach(j=>{const jk='j:'+j.id;[j.a,j.b].forEach(p=>doc.tracks.forEach(t=>[t.pts[0],t.pts[t.pts.length-1]].forEach(e=>{if(Math.hypot(e[0]-p[0],e[1]-p[1])<=JR+.01)uf.u(jk,'t:'+t.id)})))});
  if(!noPlane){const P=planeGeo();if(P)P.regions.forEach(ks=>ks.forEach(k=>uf.u(ks[0],k)))}
  return uf;
}
function ratsnest(){ // líneas de aire: árbol mínimo entre las partes de cada red que todavía no están unidas
  const ph=physical(),out=[];
  nets().forEach(keys=>{const pts=keys.map(k=>({k,...padPos(k),g:ph.f(k)}));const groups=new Map();pts.forEach(p=>{if(!groups.has(p.g))groups.set(p.g,[]);groups.get(p.g).push(p)});
    const G=[...groups.values()];if(G.length<2)return;const inT=new Set([0]);
    while(inT.size<G.length){let best=null;
      inT.forEach(i=>G.forEach((gj,j)=>{if(inT.has(j))return;G[i].forEach(a=>gj.forEach(b=>{const d=Math.hypot(a.x-b.x,a.y-b.y);if(!best||d<best.d)best={d,a,b,j}}))}));
      inT.add(best.j);out.push([best.a,best.b])}});
  return out;
}
function openLinks(){const ph=physical();return doc.links.filter(l=>{const a=padPos(l.a),b=padPos(l.b);return a&&b&&ph.f(l.a)!==ph.f(l.b)})}
function hitLink(sx,sy){let best=null,bd=6;openLinks().forEach(l=>{const a=padPos(l.a),b=padPos(l.b);const A=toS(a.x,a.y),B=toS(b.x,b.y);const d=segDist(sx,sy,A,B);if(d<bd){bd=d;best=l}});return best}
function hitLinkEnd(sx,sy){const l=doc.links.find(x=>x.id===linkSel);if(!l)return null;for(const end of ['a','b']){const q=padPos(l[end]);if(!q)continue;const [x,y]=toS(q.x,q.y);if(Math.hypot(x-sx,y-sy)<=9)return {l,end}}return null}
function netOfPad(k){return nets().find(g=>g.includes(k))||null}
// --- regla de Matías: nunca esquinas a 90°, siempre quiebres de 45° ---
const sgn=v=>v>1e-9?1:v<-1e-9?-1:0;
function dirOf(a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;return [dx/L,dy/L]}
function path45(a,b,prev){
  const dx=b[0]-a[0],dy=b[1]-a[1],ax=Math.abs(dx),ay=Math.abs(dy);
  if(ax<1e-6||ay<1e-6||Math.abs(ax-ay)<1e-6)return [b];
  const d=Math.min(ax,ay);
  const m1=ax>ay?[a[0]+sgn(dx)*(ax-d),a[1]]:[a[0],a[1]+sgn(dy)*(ay-d)]; // recto y después diagonal
  const m2=[a[0]+sgn(dx)*d,a[1]+sgn(dy)*d];                              // diagonal y después recto
  if(prev){const t1=dirOf(a,m1),t2=dirOf(a,m2);const s1=t1[0]*prev[0]+t1[1]*prev[1],s2=t2[0]*prev[0]+t2[1]*prev[1];return s2>s1+1e-6?[m2,b]:[m1,b]}
  return [m1,b];
}
function simplify(pts){
  const o=[pts[0]];for(let i=1;i<pts.length;i++){const p=pts[i],q=o[o.length-1];if(Math.hypot(p[0]-q[0],p[1]-q[1])>1e-6)o.push(p)}
  for(let i=o.length-2;i>=1;i--){const a=dirOf(o[i-1],o[i]),b=dirOf(o[i],o[i+1]);if(Math.abs(a[0]*b[1]-a[1]*b[0])<1e-6&&a[0]*b[0]+a[1]*b[1]>0)o.splice(i,1)}
  return o;
}
function chamfer(pts){ // convierte cada esquina de 90° en dos quiebres de 45°
  pts=simplify(pts);if(pts.length<3)return pts;const out=[pts[0]];
  for(let i=1;i<pts.length-1;i++){const A=pts[i-1],V=pts[i],B=pts[i+1];const d1=dirOf(A,V),d2=dirOf(V,B);const dot=d1[0]*d2[0]+d1[1]*d2[1];
    if(dot<0.69&&dot>-0.2){const l1=Math.hypot(V[0]-A[0],V[1]-A[1]),l2=Math.hypot(B[0]-V[0],B[1]-V[1]);
      const c=Math.min(1.27,(i===1?l1:l1/2),(i===pts.length-2?l2:l2/2))*0.999;
      out.push([V[0]-d1[0]*c,V[1]-d1[1]*c],[V[0]+d2[0]*c,V[1]+d2[1]*c])}
    else out.push(V)}
  out.push(pts[pts.length-1]);return simplify(out);
}
function sharpCorners(pts){let n=0;for(let i=1;i<pts.length-1;i++){const d1=dirOf(pts[i-1],pts[i]),d2=dirOf(pts[i],pts[i+1]);if(d1[0]*d2[0]+d1[1]*d2[1]<0.69)n++}return n}
function trackLen(t){let L=0;for(let i=1;i<t.pts.length;i++)L+=Math.hypot(t.pts[i][0]-t.pts[i-1][0],t.pts[i][1]-t.pts[i-1][1]);return L}
function segDist(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;let t=L?((px-a[0])*dx+(py-a[1])*dy)/L:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)}
function hitTrack(wx,wy){for(let i=doc.tracks.length-1;i>=0;i--){const t=doc.tracks[i];for(let j=1;j<t.pts.length;j++)if(segDist(wx,wy,t.pts[j-1],t.pts[j])<=t.w/2+Math.max(.3,4/scale))return t}return null}
function trackPoint(wx,wy){const q=hitPad(wx,wy);if(q)return {p:[q.x,q.y],pad:q};return {p:prefs.snap?[snapV(wx,prefs.grid/2),snapV(wy,prefs.grid/2)]:[wx,wy],pad:null}}
function previewPts(){if(!trackDraw)return null;const last=trackDraw.pts[trackDraw.pts.length-1];const prev=trackDraw.pts.length>1?dirOf(trackDraw.pts[trackDraw.pts.length-2],last):null;
  const tp=trackPoint(mouse.wx,mouse.wy);return chamfer([...trackDraw.pts,...path45(last,tp.p,prev)])}
function finishTrack(){
  if(!trackDraw)return;const pts=chamfer(trackDraw.pts);trackDraw=null;
  if(pts.length>=2&&trackLen({pts})>0.2){pushUndo();const t={id:uid(),pts,w:prefs.trackW};doc.tracks.push(t);toast(`Pista de ${f2(trackLen(t))} mm`);changed()}else draw();
  hint(HINTS.track);
}

/* ================= dibujo del tablero ================= */
let stageTop=null;
function resize(){
  const r=stage.getBoundingClientRect(),d=window.devicePixelRatio||1;
  if(stageTop!==null&&r.top!==stageTop)oy-=r.top-stageTop; // el dibujo no se mueve cuando aparece o se va la barra de arriba
  stageTop=r.top;
  const cw=Math.round(r.width*d),ch=Math.round(r.height*d);
  if(cw===cv.width&&ch===cv.height&&d===dpr&&W){draw();return}
  dpr=d;W=r.width;H=r.height;cv.width=cw;cv.height=ch;draw();
}
let rzq=0;
function queueResize(){cancelAnimationFrame(rzq);rzq=requestAnimationFrame(resize)}
function worldT(){ctx.setTransform(dpr*scale*(view==='abajo'?-1:1),0,0,dpr*scale,dpr*(ox+(view==='abajo'?2*mirC*scale:0)),dpr*oy)}
function screenT(){ctx.setTransform(dpr,0,0,dpr,0,0)}

function drawFootprint(fp,c,opt={}){
  const pr=view==='plancha',bot=view==='abajo';
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot*Math.PI/2);
  const px=1/scale;
  if(!pr){
    ctx.strokeStyle=opt.bad?C.err:opt.ghost?C.sel:C['ws-silk'];ctx.lineWidth=Math.max(0.2,px);ctx.lineCap='round';
    if(bot){ctx.globalAlpha=.35;ctx.setLineDash([.6,.5])}
    fp.silk.forEach(s=>{ctx.beginPath();
      if(s.t==='rect'){if(s.rx&&ctx.roundRect)ctx.roundRect(s.x,s.y,s.w,s.h,s.rx);else ctx.rect(s.x,s.y,s.w,s.h);if(s.fill){ctx.fillStyle=ctx.strokeStyle;ctx.fill()}ctx.stroke()}
      else if(s.t==='circle'){ctx.arc(s.cx,s.cy,s.r,0,Math.PI*2);ctx.stroke()}
      else if(s.t==='line'){ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke()}
      else ctx.stroke(new Path2D(s.d));});
    ctx.setLineDash([]);ctx.globalAlpha=1;
  }
  const cu=pr?C.toner:C['ws-copper'],ho=pr?C.paper:C['ws-bg'];
  if(opt.ghost)ctx.globalAlpha=.6;
  fp.pads.forEach(p=>{
    ctx.fillStyle=cu;ctx.beginPath();
    if(p.w){const rr=p.sq?0:Math.min(p.w,p.h)/2;if(ctx.roundRect)ctx.roundRect(p.x-p.w/2,p.y-p.h/2,p.w,p.h,rr);else ctx.rect(p.x-p.w/2,p.y-p.h/2,p.w,p.h)}
    else if(p.sq)ctx.rect(p.x-p.d/2,p.y-p.d/2,p.d,p.d);else ctx.arc(p.x,p.y,p.d/2,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle=ho;ctx.beginPath();
    if(p.sw){if(ctx.roundRect)ctx.roundRect(p.x-p.sw/2,p.y-p.sh/2,p.sw,p.sh,Math.min(p.sw,p.sh)/2);else ctx.rect(p.x-p.sw/2,p.y-p.sh/2,p.sw,p.sh)}
    else ctx.arc(p.x,p.y,p.drill/2,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;ctx.restore();
}

function strokePoly(pts,w,color,alpha=1){worldT();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.globalAlpha=1}
function drawTracks(){
  const pr=view==='plancha',cu=pr?C.toner:C['ws-copper'];
  doc.tracks.forEach(t=>{strokePoly(t.pts,t.w,cu);if(t.id===trackSel&&!pr){strokePoly(t.pts,t.w+Math.max(.4,4/scale),C.sel,.35)}});
  const pv=previewPts();if(pv&&pv.length>1){strokePoly(pv,prefs.trackW,cu,.75);strokePoly(pv,Math.max(.12,1/scale),C.sel)}
}
function drawAir(){
  if(view==='plancha')return;screenT();
  const ph=physical();
  const line=(A,B,col,w,dash)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();ctx.setLineDash([])};
  doc.links.forEach(l=>{const a=padPos(l.a),b=padPos(l.b);if(!a||!b)return;
    const editing=drag&&drag.type==='linkEnd'&&drag.l===l;const routed=ph.f(l.a)===ph.f(l.b);if(routed&&l.id!==linkSel)return;
    let A=toS(a.x,a.y),B=toS(b.x,b.y);
    if(editing){const t=hoverPad?toS(hoverPad.x,hoverPad.y):[mouse.x,mouse.y];if(drag.end==='a')A=t;else B=t}
    const isSel=l.id===linkSel;line(A,B,isSel?C.sel:C.accent,isSel?2.2:1.2,isSel?[7,4]:[5,4]);
    if(isSel)[A,B].forEach(([x,y])=>{ctx.fillStyle=C.panel;ctx.strokeStyle=C.sel;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();ctx.stroke()});

function endPointer(e){

    if(hoverPad&&hoverPad.k!==other&&hoverPad.k!==l[end]){pushUndo();l[end]=hoverPad.k;toast('Conexión movida');hoverPad=null;changed()}else{hoverPad=null;draw()}return}
  if(drag.type==='outline'){const r=drag.rect;drag=null;
    if(r&&r.w>=2&&r.h>=2){pushUndo();doc.outline=r;outlineSel=true;sel.clear();toast(`Contorno de ${cm(r.w)} × ${cm(r.h)} cm`);setTool('select');changed()}
    else draw();return}
  if(drag.type==='marquee'){const r=drag.sr;if(r[2]-r[0]>4||r[3]-r[1]>4){const [ax,ay]=toW(r[0],r[1]),[bx,by]=toW(r[2],r[3]);const x0=Math.min(ax,bx),x1=Math.max(ax,bx);
    doc.comps.forEach(c=>{const b=compBox(c);if(b[0]>=x0&&b[2]<=x1&&b[1]>=ay&&b[3]<=by)sel.add(c.id)})}}
  if((drag.type==='move'||drag.type==='hole')&&drag.moved){const bad=drag.type==='move'?anyBlocked():(()=>{const H=holeList().find(h=>h.src===drag.h);return H&&holeBlocked(H.x,H.y,H.keep,H.id)})();
    if(bad){drag=null;restore(undo.pop());toast(NO_DROP);return}}

function selComps(){return doc.comps.filter(c=>sel.has(c.id))}
function rotateSel(){
  if(placing){placing.c.rot=(placing.c.rot+1)%4;snapComp(placing.c);draw();return}
  const s=selComps();if(!s.length)return;if(s.some(c=>c.lock)){toast('Tiene candado: no se rota');return}pushUndo();
  if(s.length===1){s[0].rot=(s[0].rot+1)%4;snapComp(s[0])}
  else{const b=s.map(compBox);const cx=(Math.min(...b.map(q=>q[0]))+Math.max(...b.map(q=>q[2])))/2,cy=(Math.min(...b.map(q=>q[1]))+Math.max(...b.map(q=>q[3])))/2;
    s.forEach(c=>{const [x,y]=rot(c.x-cx,c.y-cy,1);c.x=cx+x;c.y=cy+y;c.rot=(c.rot+1)%4;snapComp(c)})}
  if(anyBlocked()){restore(undo.pop());toast('Así rotado queda encima de otro componente o de un agujero');return}
  changed();
}
function deleteSel(){
  if(linkSel){pushUndo();doc.links=doc.links.filter(l=>l.id!==linkSel);linkSel=null;toast('Conexión borrada');changed();return}
  if(holeSel){pushUndo();doc.holes=doc.holes.filter(h=>h.id!==holeSel);holeSel=null;toast('Agujero borrado');changed();return}
  if(trackSel&&(doc.tracks.find(t=>t.id===trackSel)||{}).lock){toast('Pista con candado: no se borra');return}
  if(trackSel){pushUndo();doc.tracks=doc.tracks.filter(t=>t.id!==trackSel);trackSel=null;toast('Pista borrada');changed();return}
  if(outlineSel&&doc.outline){pushUndo();doc.outline=null;outlineSel=false;toast('Contorno borrado');changed();return}
  if(selComps().some(c=>c.lock)){toast('Tiene candado: no se borra');return}
  const n=sel.size;if(!n)return;pushUndo();doc.comps=doc.comps.filter(c=>!sel.has(c.id));doc.links=doc.links.filter(l=>!sel.has(l.a.split(':')[0])&&!sel.has(l.b.split(':')[0]));sel.clear();toast(n===1?'Componente borrado':`${n} componentes borrados`);changed();
}

  const base=nw.map(c=>[c.x,c.y]),ids=new Set(nw.map(c=>c.id));let ok=false;
  for(let k=1;k<=20&&!ok;k++)for(const [dx,dy] of [[k,k],[k,0],[0,k],[-k,k],[k,-k]]){nw.forEach((c,i)=>{c.x=base[i][0]+dx*5.08;c.y=base[i][1]+dy*5.08});if(!nw.some(c=>compBlocked(c,ids))){ok=true;break}}

function fit(){
  const boxes=doc.comps.map(compBox);if(doc.outline){const o=doc.outline;boxes.push([o.x,o.y,o.x+o.w,o.y+o.h])}
  if(!boxes.length){scale=6;ox=RW+40;oy=RW+40;draw();return}
  const x0=Math.min(...boxes.map(b=>b[0])),y0=Math.min(...boxes.map(b=>b[1])),x1=Math.max(...boxes.map(b=>b[2])),y1=Math.max(...boxes.map(b=>b[3]));
  const m=60;scale=Math.min(40,Math.max(1,Math.min((W-m*2-RW)/(x1-x0||10),(H-m*2-RW)/(y1-y0||10))));
  mirC=(x0+x1)/2;

  if(view==='abajo')ox=RW+(W-RW)/2-(2*mirC-cx)*scale;

}

/* ================= revisión de reglas (DRC) ================= */
const DRC={gap:0.6,minW:0.5,edge:2};
let drcList=[],drcDirty=true,drcFocus=-1;
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[ch]);
// cada cobre es un polígono convexo (1, 2 o 4 puntos) engordado r: pad redondo, óvalo, cuadrado o tramo de pista
function padShape(c,p){
  const [cx,cy]=padWorld(c,p);let w=p.w||p.d,h=p.h||p.d;if(c.rot%2)[w,h]=[h,w];
  if(p.sq){const a=w/2,b=h/2;return {pts:[[cx-a,cy-b],[cx+a,cy-b],[cx+a,cy+b],[cx-a,cy+b]],r:0}}
  const r=Math.min(w,h)/2,a=w/2-r,b=h/2-r;return {pts:a>1e-6||b>1e-6?[[cx-a,cy-b],[cx+a,cy+b]]:[[cx,cy]],r};
}
function cpSeg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;let t=L?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L:0;t=Math.max(0,Math.min(1,t));return [a[0]+t*dx,a[1]+t*dy]}
function segCross(a,b,c,d){const o=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);return o(c,d,a)*o(c,d,b)<0&&o(a,b,c)*o(a,b,d)<0}
function inPoly(p,P){if(P.length<3)return false;let s=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],v=Math.sign((b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]));if(v){if(s&&v!==s)return false;s=v}}return true}
function shapeDist(A,B){ // separación entre bordes de cobre y punto medio de la zona más angosta
  const edges=P=>P.length>1?P.map((p,i)=>[p,P[(i+1)%P.length]]):[[P[0],P[0]]];
  let best={d:1e9,x:0,y:0};const mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];
  for(const [a,b] of edges(A.pts))for(const [c,d] of edges(B.pts)){
    if(segCross(a,b,c,d)){const m=mid(a,b);best={d:0,x:m[0],y:m[1]};break}
    for(const [p,s,t] of [[a,c,d],[b,c,d],[c,a,b],[d,a,b]]){const q=cpSeg(p,s,t),e=Math.hypot(p[0]-q[0],p[1]-q[1]);if(e<best.d){const m=mid(p,q);best={d:e,x:m[0],y:m[1]}}}
  }
  if(inPoly(B.pts[0],A.pts))best={d:0,x:B.pts[0][0],y:B.pts[0][1]};else if(inPoly(A.pts[0],B.pts))best={d:0,x:A.pts[0][0],y:A.pts[0][1]};
  return {d:best.d-A.r-B.r,x:best.x,y:best.y};
}
function padName(k){const [cid,n]=k.split(':');const c=doc.comps.find(x=>x.id===cid);return c?`${c.ref}.${n}`:'?'}
function runDrc(){
  const out=[],add=(t,m,x,y,who=[])=>out.push({t,m,x,y,who});
  const W=it=>({cid:it.cid,tid:it.tid,jid:it.jid,lock:it.cid?!!(doc.comps.find(c=>c.id===it.cid)||{}).lock:it.tid?!!(doc.tracks.find(t=>t.id===it.tid)||{}).lock:false});
  const ph=physical(),items=copperItems(ph,{tears:true});
  // 1. separación entre cobres de distinta red
  const seen=new Set();
  for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const A=items[i],B=items[j];
    if(A.b[0]>B.b[2]+DRC.gap||B.b[0]>A.b[2]+DRC.gap||A.b[1]>B.b[3]+DRC.gap||B.b[1]>A.b[3]+DRC.gap)continue;
    if(A.cid&&A.cid===B.cid)continue; // dentro de una huella ya lo verifica la biblioteca
    if(sameNet(A,B))continue;
    const r=shapeDist(A,B);if(r.d>=DRC.gap-1e-6)continue;
    const key=[A.tid||A.jid||A.k,B.tid||B.jid||B.k].sort().join('|');if(seen.has(key))continue;seen.add(key);
    add('Separación',`${A.name} y ${B.name}: ${r.d<=0?'se tocan':f2(r.d)+' mm'}`,r.x,r.y,[W(A),W(B)])}
  // 2. ancho de pista
  doc.tracks.forEach(t=>{if(t.w<DRC.minW-1e-6){const p=t.pts[Math.floor(t.pts.length/2)];add('Ancho',`Pista de ${f2(t.w)} mm`,p[0],p[1],[{tid:t.id,lock:!!t.lock}])}});
  // 3. borde de placa
  if(doc.outline){const o=doc.outline,worst=new Map();
    items.forEach(it=>{const m=Math.min(it.b[0]-o.x,it.b[1]-o.y,o.x+o.w-it.b[2],o.y+o.h-it.b[3]);if(m>=DRC.edge-1e-6)return;
      const id=it.cid||it.tid||it.jid;if(!worst.has(id)||m<worst.get(id).m)worst.set(id,{m,it})});
    worst.forEach(({m,it})=>{const c=it.cid&&doc.comps.find(x=>x.id===it.cid);const x=(it.b[0]+it.b[2])/2,y=(it.b[1]+it.b[3])/2;
      add('Borde',`${c?c.ref:it.jid?'Puente':'Pista'}: ${m<0?'fuera de la placa':f2(m)+' mm del borde'}`,x,y,[W(it)])})}
  // 3b. agujeros de fijación: nada de cobre alrededor
  holeList().forEach(h=>{const near=new Set();items.forEach(it=>{const id=it.cid||it.tid||it.jid;if(near.has(id)||shapePtDist(it,h.x,h.y)>=h.keep-1e-6)return;near.add(id);
    const c=it.cid&&doc.comps.find(x=>x.id===it.cid);add('Agujero',`${c?c.ref:it.jid?'Puente':'Pista'} muy cerca del agujero de fijación`,h.x,h.y,[W(it)])})});
  // 4. esquinas: quiebres de 45° como máximo, también en uniones entre pistas

    document.getElementById('pLock').onclick=()=>{const v=!s.every(c=>c.lock);pushUndo();s.forEach(c=>c.lock=v);toast(v?'Fijados':'Candados quitados');changed()};
  }
  document.getElementById('pDel').onclick=deleteSel;
  document.getElementById('pClose').onclick=()=>{sel.clear();outlineSel=false;refreshUI();draw()};
}
function updateStatus(){
  const z=document.getElementById('zoomv');if(z)z.textContent=Math.round(scale/6*100)+'%';

}

/* ================= teclado ================= */
document.addEventListener('keydown',e=>{
  if(document.querySelector('.ov'))return;
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='select'||tag==='textarea')return;
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod&&k==='z'&&!e.shiftKey){e.preventDefault();doUndo()}
  else if(mod&&(k==='y'||(k==='z'&&e.shiftKey))){e.preventDefault();doRedo()}
  else if(mod&&k==='d'){e.preventDefault();duplicateSel()}
  else if(mod&&k==='a'){e.preventDefault();selectAll()}
  else if(mod&&k==='s'){e.preventDefault();save(false)}
  else if(mod)return;
  else if(k==='escape'){closeMenu();if(trackDraw){finishTrack();return}if(linkFrom){linkFrom=null;hint(HINTS.link);draw();return}if(placing){placing=null;hint(null)}else if(tool!=='select')setTool('select');else{sel.clear();outlineSel=false;holeSel=null;trackSel=null;linkSel=null}measure=null;refreshUI();draw()}
  else if(k==='r'){rotateSel()}
  else if(k==='backspace'&&trackDraw){e.preventDefault();if(trackDraw.pts.length>1)trackDraw.pts.pop();else trackDraw=null;draw()}
  else if(k==='enter'&&trackDraw){finishTrack()}
  else if(k==='delete'||k==='backspace'){e.preventDefault();deleteSel()}
  else if(k==='v')setTool('select');else if(k==='h')setTool('hand');else if(k==='b')setTool('outline');else if(k==='m')setTool('measure');else if(k==='c')setTool('link');else if(k==='t')setTool('track');else if(k==='d')drcDlg();else if(k==='a')routeDlg();
  else if(k==='f')fit();else if(k==='+'||k==='=')(zoomAt(W/2,H/2,1.25),draw());else if(k==='-')(zoomAt(W/2,H/2,.8),draw());
  else if(k===' '&&!spaceDown){spaceDown=true;cv.style.cursor='grab';e.preventDefault()}
  else if(e.key.startsWith('Arrow')&&sel.size){e.preventDefault();if(selComps().some(c=>c.lock)){toast('Tiene candado: no se mueve');return}pushUndo();const g=prefs.snap?prefs.grid:0.1;const d={arrowleft:[-g,0],arrowright:[g,0],arrowup:[0,-g],arrowdown:[0,g]}[k];selComps().forEach(c=>{c.x+=d[0];c.y+=d[1]});if(anyBlocked()){restore(undo.pop());toast(NO_DROP);return}changed()}
});
document.addEventListener('keyup',e=>{if(e.key===' '){spaceDown=false;cv.style.cursor=tool==='hand'?'grab':tool==='select'?'default':'crosshair'}});

function example(){
  const pick=a=>DB.find(c=>c.alias.includes(a));
  const items=[['ne555',40,30,0],['resistencia',22,24,1],['resistencia',22,36,1],['electrolitico',30,46,0],['resistencia',58,24,0],['led',70,26,0],['bornera',42,50,0]];
  doc={name:null,example:true,comps:[],outline:null};
  items.forEach(([a,x,y,r])=>{const comp=pick(a);if(comp)doc.comps.push(makeComp(comp,x,y,r))});
  const e=doc.comps.find(c=>c.name.startsWith('Electrolítico'));if(e)e.val='10 µF';
  doc.tracks=[];doc.links=[];doc.jumpers=[];doc.tears=false;doc.plane=null;doc.holes=[];const R={};doc.comps.forEach(c=>R[c.ref]=c.id);const K=s=>{const [r,n]=s.split('.');return pkey(R[r],n)};
  [['U1.8','U1.4'],['U1.8','R1.1'],['R1.2','U1.7'],['U1.7','R2.1'],['R2.2','U1.6'],['U1.6','U1.2'],['U1.2','C1.1'],['C1.2','U1.1'],['U1.3','R3.1'],['R3.2','LED1.2'],['LED1.1','U1.1'],['J1.1','U1.8'],['J1.2','U1.1']]
    .forEach(([a,b])=>{if(R[a.split('.')[0]]&&R[b.split('.')[0]])doc.links.push({a:K(a),b:K(b)})});
}
